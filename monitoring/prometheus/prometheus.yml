# Prometheus config - scrapes the captioning app + node_exporter every 5s
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: da3408-a4

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  # streamlit app metrics (prometheus_client, port 8000)
  - job_name: caption_app
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          service: blip-captioner

  # system metrics (cpu / ram / disk / network) from node_exporter
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          host: da3408-vm

  # prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
